name: Apply gallery polish

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update gallery and CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          gallery = '''<section id="gallery"><div class="container"><div class="section-eyebrow reveal">Портфолио</div><h2 class="section-title reveal">Наши <span>работы</span></h2><div class="gallery-grid">
          <div class="gallery-item reveal"><img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=1200&q=85" alt="Маникюр 1"></div>
          <div class="gallery-item reveal"><img src="https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&fit=crop&w=1000&q=85" alt="Маникюр 2"></div>
          <div class="gallery-item reveal"><img src="https://images.unsplash.com/photo-1610992015732-2449b76344bc?auto=format&fit=crop&w=1000&q=85" alt="Nail art 3"></div>
          <div class="gallery-item reveal"><img src="https://nehtyprofi.s2.cdn-upgates.com/_cache/1/b/1b9560c67a731268be004e081d20478c-4a8u3s3rih9smwuaxpsqb4lsg1dwy7ajl803izkhg72gz2hu2t7ybwjed3iuifao.jpg" alt="Маникюр 4"></div>
          <div class="gallery-item reveal"><img src="https://images.cdn-files-a.com/uploads/5590846/2000_626df2c522210.jpg" alt="Золотой nail art 5"></div>
          <div class="gallery-item reveal"><img src="https://luxurynailsspalancaster.com/wp-content/uploads/2025/03/nail-art-flowers-scaled-2.jpg" alt="Дизайн ногтей 6"></div>
          <div class="gallery-item reveal"><img src="https://images.unsplash.com/photo-1607779097040-26e80aa78e66?auto=format&fit=crop&w=1000&q=85" alt="Маникюр 7"></div>
          <div class="gallery-item reveal"><img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=1000&q=85" alt="Маникюр и уход 8"></div>
          <div class="gallery-item reveal"><img src="https://estaticosgn-cdn.deia.eus/clip/8e715868-78c2-4dc6-b7ca-b50385be0054_source-aspect-ratio_default_0.jpg" alt="Маникюр в салоне 9"></div>
          <div class="gallery-item reveal"><img src="https://shop.shoreditchnails.com/cdn/shop/files/Shoreditch_Nails_August_2022_150.jpg?v=1692719476&width=1500" alt="Маникюр в студии 10"></div>
          <div class="gallery-item reveal"><img src="https://i.pinimg.com/736x/a5/5c/19/a55c19f655722c8f4637904ff5f739bf.jpg" alt="Профессиональный маникюр 11"></div>
          <div class="gallery-item reveal"><img src="https://www.musanails.com/media/wysiwyg/corsi.jpg" alt="Маникюр и инструменты 12"></div>
          </div></div></section>'''

          pattern = r'<section id="gallery">.*?</section>\n\n<section id="contacts">'
          replacement = gallery + '\n\n<section id="contacts">'
          updated, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Gallery section was not found exactly once')
          index.write_text(updated, encoding='utf-8')

          css = Path('style.css')
          extra = '''

/* FINAL GALLERY + CONTACT CTA */
#gallery .gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-auto-rows:230px!important;gap:14px!important}
#gallery .gallery-item:first-child{grid-row:span 1!important}
#gallery .gallery-item{min-height:230px!important;border-radius:12px!important;background:#ead7c3!important;box-shadow:0 12px 35px rgba(55,37,27,.08)!important}
#gallery .gallery-item img{width:100%!important;height:100%!important;object-fit:cover!important}
#contacts .contacts-info .btn-primary{transition:.35s cubic-bezier(.16,1,.3,1)!important;box-shadow:0 12px 28px rgba(36,27,23,.16)!important}
#contacts .contacts-info .btn-primary:hover{background:#98643e!important;color:#fff!important;transform:translateY(-3px)!important;box-shadow:0 18px 34px rgba(36,27,23,.22)!important}
@media(max-width:900px){#gallery .gallery-grid{grid-template-columns:1fr 1fr!important}#gallery .gallery-item{min-height:200px!important}}
@media(max-width:640px){#gallery .gallery-grid{grid-template-columns:1fr 1fr!important;grid-auto-rows:180px!important}#gallery .gallery-item{min-height:180px!important}}
'''
          css.write_text(css.read_text(encoding='utf-8') + extra, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-gallery.yml
          git add index.html style.css .github/workflows/fix-gallery.yml
          git diff --cached --quiet || git commit -m "Polish contact CTA and complete four-row gallery"
          git push
